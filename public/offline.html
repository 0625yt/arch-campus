<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="robots" content="noindex" />
    <title>인터넷 연결 확인 · arch</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 32px 24px; background: #fafafa; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); }
      img { width: 56px; height: 56px; border-radius: 13px; margin-bottom: 24px; }
      h1 { margin: 0 0 16px; font-size: 28px; letter-spacing: -0.04em; line-height: 1.3; word-break: keep-all; }
      p { margin: 0 0 12px; line-height: 1.7; color: #515154; word-break: keep-all; }
      a { display: inline-flex; align-items: center; justify-content: center; margin-top: 16px; min-height: 48px; padding: 12px 20px; border-radius: 12px; background: #0071e3; color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #1d1d1f; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) {
        body { background: #141416; color: #f5f5f7; }
        p { color: #b8b8be; }
        a:focus-visible { outline-color: #f5f5f7; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="arch" width="56" height="56" />
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>학습 자료와 일정은 인터넷에 연결되면 다시 볼 수 있어요.</p>
      <p>작성 중이던 화면은 닫지 말고, 연결 후 저장 여부를 확인해 주세요.</p>
      <a href="/dashboard">다시 연결하기</a>
    </main>
  </body>
</html>
