<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="arch — 강의자료와 강의계획서로 만드는 한 학기 운영 OS">
  <title>arch — 한 학기 운영 OS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#EAEAF0"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="55%" stop-color="#4F7BE8"/>
      <stop offset="100%" stop-color="#8E7EE0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="100" r="280" fill="#0071E3" fill-opacity="0.06"/>
  <circle cx="1100" cy="540" r="320" fill="#8E7EE0" fill-opacity="0.08"/>

  <!-- 좌측: 큰 brand 박스 + arch 글리프 -->
  <g transform="translate(96 175)">
    <rect width="280" height="280" rx="62" fill="url(#brand)"/>
    <rect width="280" height="280" rx="62" fill="url(#shine)"/>
    <g transform="translate(140 140)">
      <g stroke="#ffffff" stroke-width="30" stroke-linecap="round" fill="none">
        <path d="M -57 55 L -57 -3"/>
        <path d="M 57 55 L 57 -3"/>
        <path d="M -57 -3 A 57 57 0 0 1 57 -3"/>
      </g>
    </g>
  </g>

  <!-- 우측: 카피 -->
  <g transform="translate(456 200)">
    <text
      x="0" y="0"
      font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
      font-size="22"
      font-weight="700"
      fill="#0071E3"
      letter-spacing="3"
    >ARCH · 한 학기 운영 OS</text>

    <text
      x="0" y="86"
      font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
      font-size="68"
      font-weight="700"
      fill="#1D1D1F"
      letter-spacing="-2"
    >대학 생활을</text>
    <text
      x="0" y="170"
      font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
      font-size="68"
      font-weight="700"
      fill="#6E6E73"
      letter-spacing="-2"
    >놓치지 않게.</text>

    <text
      x="0" y="240"
      font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
      font-size="22"
      font-weight="450"
      fill="#6E6E73"
      letter-spacing="-0.3"
    >강의자료·강의계획서·시간표를 올리면</text>
    <text
      x="0" y="274"
      font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
      font-size="22"
      font-weight="450"
      fill="#6E6E73"
      letter-spacing="-0.3"
    >오늘 할 일과 공부 흐름을 자동으로 정리.</text>
  </g>

  <rect x="96" y="568" width="1008" height="1" fill="#1D1D1F" fill-opacity="0.08"/>
  <text
    x="96" y="596"
    font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="16"
    font-weight="560"
    fill="#6E6E73"
    letter-spacing="-0.2"
  >arch-campus.vercel.app</text>
</svg>
