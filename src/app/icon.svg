<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="arch">
  <title>arch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="55%" stop-color="#4F7BE8"/>
      <stop offset="100%" stop-color="#8E7EE0"/>
    </linearGradient>
    <linearGradient id="topShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bottomGlow" cx="0.5" cy="1" r="0.7">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 squircle (iOS는 자체 마스크) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#topShine)"/>
  <rect width="512" height="512" rx="112" fill="url(#bottomGlow)"/>

  <!--
    Arch 글리프 — 두 기둥 + 위 반원. stroke 54 (size 32 기준 3.4의 비례).
    중심 (256, 256), 폭 약 208, 높이 약 96.
  -->
  <g stroke="#ffffff" stroke-width="54" stroke-linecap="round" fill="none">
    <!-- 좌 기둥 -->
    <path d="M 152 356 L 152 260"/>
    <!-- 우 기둥 -->
    <path d="M 360 356 L 360 260"/>
    <!-- 위 곡선 -->
    <path d="M 152 260 A 104 104 0 0 1 360 260"/>
  </g>

  <!-- ground highlight -->
  <ellipse cx="256" cy="384" rx="104" ry="9.6" fill="#ffffff" fill-opacity="0.18"/>
</svg>
